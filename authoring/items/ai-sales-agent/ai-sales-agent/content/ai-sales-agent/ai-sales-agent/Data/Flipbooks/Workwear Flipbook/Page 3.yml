      Value: 'Hygiene you can wear When it comes to food processing, every detail counts. That’s why we offer comfortable, practical workwear certified to DIN 10524 and designed for the food industry’s strict hygiene requirements. We don’t design our collections around individual garments, but around the needs of the people who wear them. Each collection is tailored to different working environments, combining hygienic solutions, all-day comfort and practical features for everyday work. Our passion for textiles goes back more than 100 years and shows in our professional laundry care and attention to detail – in every fibre and every seam. | 3'
