    - ID: "cab9ac37-5565-41a7-ad7c-6b5a21b917c0"
      Hint: Question
      Value: "Can AI sales agents replace human sales reps?"
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"
      Hint: __Updated
      Value: 20260921T162923Z
    - ID: "debd65ae-b150-4903-8a34-465eb240d37b"
      Hint: Answer
      Value: |
        <div class="ck-content"><p><span>Not entirely, and that’s by design. AI Sale Agent is built to absorb repetitive work like cold outreach, initial qualification, follow ups, and renewals, so your human reps spend their time on high value conversations and closing instead of admin. Most customers use it to scale call volume without scaling headcount, while keeping people in the loop for relationship building and complex deals.&nbsp;</span></p></div>
