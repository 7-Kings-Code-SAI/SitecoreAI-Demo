    - ID: "cab9ac37-5565-41a7-ad7c-6b5a21b917c0"
      Hint: Question
      Value: "Benötige ich technische Kenntnisse oder Programmierkenntnisse, um einen Agenten zu erstellen?"
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"
      Hint: __Updated
      Value: 20261006T103736Z
    - ID: "debd65ae-b150-4903-8a34-465eb240d37b"
      Hint: Answer
      Value: |
        <div class="ck-content"><p><span>Nein. Agenten werden über das Dashboard der Plattform konfiguriert. Sie wählen eine Stimme und einen Akzent aus, definieren die Persönlichkeit und schreiben das Playbook in einfacher Sprache. Es ist kein Code erforderlich, weshalb die Einrichtung nur wenige Minuten statt eines Entwicklungszyklus dauert.&nbsp;</span></p></div>
