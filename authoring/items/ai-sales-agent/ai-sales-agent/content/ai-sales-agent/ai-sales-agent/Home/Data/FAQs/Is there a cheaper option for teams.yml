      Hint: Question
      Value: "Postoji li jeftinija opcija za timove s manjim brojem poziva?"
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"
      Hint: __Updated
      Value: 20261007T145224Z
    - ID: "debd65ae-b150-4903-8a34-465eb240d37b"
      Hint: Answer
      Value: |
        <div class="ck-content"><p><span>Da. Možete započeti sa 7-dnevnim besplatnim probnim razdobljem (3 sata poziva, 3 agenta, 3 kampanje, do 100 leadova, 1 CRM plus 1 VoIP integracija) kako biste testirali platformu bez ikakvih troškova. Nakon toga, cijena se prema zadanim postavkama obračunava po modelu plaćanja prema potrošnji, naplata je po minuti i nije potreban unaprijed uplaćen saldo, tako da trošak izravno prati stvarnu upotrebu. Mjesečna naplata također je dostupna za timove koji žele predvidljive troškove i popust do 31 %.&nbsp;</span></p></div>
