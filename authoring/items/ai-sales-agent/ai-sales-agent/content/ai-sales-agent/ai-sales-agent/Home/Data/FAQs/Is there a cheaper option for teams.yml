      Hint: Question
      Value: "Finns det ett billigare alternativ för team med lägre samtalsvolym?"
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"
      Hint: __Updated
      Value: 20261006T105532Z
    - ID: "debd65ae-b150-4903-8a34-465eb240d37b"
      Hint: Answer
      Value: |
        <div class="ck-content"><p><span>Ja. Du kan börja med den 7 dagar långa kostnadsfria provperioden (3 timmars samtal, 3 agenter, 3 kampanjer, upp till 100 leads, 1 CRM- samt 1 VoIP-integration) för att testa plattformen utan kostnad. Därefter är prissättningen som standard pay-as-you-go, debiterad per minut utan krav på förbetalt saldo, så kostnaden skalar direkt med den faktiska användningen. Månadsfakturering är också tillgänglig för team som vill ha förutsägbara kostnader och en rabatt på upp till 31 %.&nbsp;</span></p></div>
