    - ID: "cab9ac37-5565-41a7-ad7c-6b5a21b917c0"
      Hint: Question
      Value: "Is there a cheaper option for teams with lower call volume?"
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"
      Hint: __Updated
      Value: 20260921T163100Z
    - ID: "debd65ae-b150-4903-8a34-465eb240d37b"
      Hint: Answer
      Value: |
        <div class="ck-content"><p><span>Yes. You can start with the 7 day free trial (3 hours of calling, 3 agents, 3 campaigns, up to 100 leads, 1 CRM plus 1 VoIP integration) to test the platform at no cost. After that, pricing is pay as you go by default, billed per minute with no prepaid balance required, so cost scales directly with actual usage. Monthly billing is also available for teams that want predictable costs and a discount of up to 31%.&nbsp;</span></p></div>
