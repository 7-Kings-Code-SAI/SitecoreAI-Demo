    - ID: "cab9ac37-5565-41a7-ad7c-6b5a21b917c0"
      Hint: Question
      Value: "Gibt es eine günstigere Option für Teams mit geringerem Anrufvolumen?"
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"
      Hint: __Updated
      Value: 20261006T103736Z
    - ID: "debd65ae-b150-4903-8a34-465eb240d37b"
      Hint: Answer
      Value: |
        <div class="ck-content"><p><span>Ja. Sie können mit der 7-tägigen kostenlosen Testversion beginnen (3 Stunden Anrufe, 3 Agenten, 3 Kampagnen, bis zu 100 Leads, 1 CRM- plus 1 VoIP-Integration), um die Plattform kostenlos zu testen. Danach erfolgt die Preisgestaltung standardmäßig nach dem Pay-as-you-go-Prinzip, abgerechnet pro Minute ohne erforderliches Prepaid-Guthaben, sodass die Kosten direkt mit der tatsächlichen Nutzung skalieren. Eine monatliche Abrechnung ist ebenfalls verfügbar für Teams, die planbare Kosten und einen Rabatt von bis zu 31 % wünschen.&nbsp;</span></p></div>
