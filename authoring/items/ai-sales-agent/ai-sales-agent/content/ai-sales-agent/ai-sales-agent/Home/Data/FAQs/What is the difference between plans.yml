    - ID: "cab9ac37-5565-41a7-ad7c-6b5a21b917c0"
      Hint: Question
      Value: "Koja je razlika između paketa Silver, Gold i Platinum?"
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"
      Hint: __Updated
      Value: 20261007T145224Z
    - ID: "debd65ae-b150-4903-8a34-465eb240d37b"
      Hint: Answer
      Value: |
        <div class="ck-content"><p><span>Osnovna razlika je u opsegu i razini podrške. Silver uključuje 5 prilagođenih agenata, 10 kampanja i 15 dana pohrane podataka o pozivima. Gold povećava to na 10 agenata, 15 kampanja, 60 dana pohrane te dodaje 24/7 internetsku i telefonsku podršku. Platinum uklanja ograničenja (neograničen broj agenata, neograničen broj kampanja, neograničena pohrana) uz prilagođenu API integraciju, namjenskog voditelja računa i privatnu pohranu. Enterprise paketi idu i korak dalje uz prilagođenu infrastrukturu, namjenske telefonske brojeve i SLA.&nbsp;</span></p></div>
