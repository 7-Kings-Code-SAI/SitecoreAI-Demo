        <div class="ck-content"><p><span>The main difference is scale and level of support. Silver includes 5 custom agents, 10 campaigns and 15 days of call data storage. Gold increases this to 10 agents, 15 campaigns, 60 days of storage, and adds 24/7 online and phone support. Platinum removes the limits (unlimited agents, unlimited campaigns, unlimited storage) with custom API integration, a dedicated account manager and private storage. Enterprise plans go further with custom infrastructure, dedicated phone numbers and an SLA.&nbsp;</span></p></div>
