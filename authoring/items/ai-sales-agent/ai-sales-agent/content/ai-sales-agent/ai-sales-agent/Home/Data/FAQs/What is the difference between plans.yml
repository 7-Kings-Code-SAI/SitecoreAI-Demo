    - ID: "cab9ac37-5565-41a7-ad7c-6b5a21b917c0"
      Hint: Question
      Value: "What's the difference between the Silver, Gold, and Platinum plans?"
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"
      Hint: __Updated
      Value: 20260921T163042Z
    - ID: "debd65ae-b150-4903-8a34-465eb240d37b"
      Hint: Answer
      Value: |
        <div class="ck-content"><p><span>The core difference is scale and support level. Silver includes 5 custom agents, 10 campaigns, and 15 days of call data storage. Gold steps up to 10 agents, 15 campaigns, 60 days of storage, and adds 24/7 online &amp; phone support. Platinum removes the caps (Unlimited agents, Unlimited campaigns, unlimited storage) with custom API integration, a dedicated account manager, and private storage. Enterprise plans go further with custom infrastructure, dedicated phone numbers, and an SLA.&nbsp;</span></p></div>
