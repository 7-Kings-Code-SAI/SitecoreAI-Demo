    - ID: "cab9ac37-5565-41a7-ad7c-6b5a21b917c0"
      Hint: Question
      Value: "Vad är skillnaden mellan planerna Silver, Gold och Platinum?"
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"
      Hint: __Updated
      Value: 20261006T105532Z
    - ID: "debd65ae-b150-4903-8a34-465eb240d37b"
      Hint: Answer
      Value: |
        <div class="ck-content"><p><span>Den grundläggande skillnaden är omfattningen och nivån på supporten. Silver inkluderar 5 anpassade agenter, 10 kampanjer och 15 dagars lagring av samtalsdata. Gold ökar till 10 agenter, 15 kampanjer, 60 dagars lagring och lägger till online- och telefonsupport dygnet runt. Platinum tar bort begränsningarna (obegränsat antal agenter, obegränsat antal kampanjer, obegränsad lagring) med anpassad API-integration, en dedikerad kundansvarig och privat lagring. Enterprise-planer går ännu längre med anpassad infrastruktur, dedikerade telefonnummer och ett SLA.&nbsp;</span></p></div>
