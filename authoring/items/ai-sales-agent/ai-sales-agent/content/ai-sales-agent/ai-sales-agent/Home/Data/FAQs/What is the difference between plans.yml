    - ID: "cab9ac37-5565-41a7-ad7c-6b5a21b917c0"
      Hint: Question
      Value: "Was ist der Unterschied zwischen den Tarifen Silver, Gold und Platinum?"
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"
      Hint: __Updated
      Value: 20261006T103736Z
    - ID: "debd65ae-b150-4903-8a34-465eb240d37b"
      Hint: Answer
      Value: |
        <div class="ck-content"><p><span>Der Hauptunterschied liegt im Umfang und im Supportniveau. Silver umfasst 5 benutzerdefinierte Agenten, 10 Kampagnen und 15 Tage Speicherung von Anrufdaten. Gold erhöht dies auf 10 Agenten, 15 Kampagnen, 60 Tage Speicherung und ergänzt einen 24/7-Online- und Telefonsupport. Platinum hebt die Begrenzungen auf (unbegrenzte Agenten, unbegrenzte Kampagnen, unbegrenzte Speicherung) mit benutzerdefinierter API-Integration, einem dedizierten Account Manager und privatem Speicher. Enterprise-Tarife gehen noch weiter mit benutzerdefinierter Infrastruktur, dedizierten Telefonnummern und einem SLA.&nbsp;</span></p></div>
