    - ID: "cab9ac37-5565-41a7-ad7c-6b5a21b917c0"
      Hint: Question
      Value: "Lässt sich AI Sale Agent in mein CRM- und Telefonsystem integrieren?"
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"
      Hint: __Updated
      Value: 20261006T103736Z
    - ID: "debd65ae-b150-4903-8a34-465eb240d37b"
      Hint: Answer
      Value: |
        <div class="ck-content"><p><span>Ja. Es lässt sich nativ in HubSpot, Salesforce, Monday.com, Zoho CRM, Pipedrive, Freshworks, Insightly, Nimble, Copper und Close integrieren und verbindet sich mit Telefonieanbietern wie Twilio, RingCentral, SignalWire, Telnyx, Vonage und Zoom Phone. Wenn Sie ein CRM verwenden, das nicht aufgeführt ist, kann das Team eine benutzerdefinierte Integration erstellen.&nbsp;</span></p></div>
