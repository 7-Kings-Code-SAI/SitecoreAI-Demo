      Hint: Question
      Value: "Are there hidden fees for AI or LLM usage?"
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"
      Hint: __Updated
      Value: 20260921T163049Z
    - ID: "debd65ae-b150-4903-8a34-465eb240d37b"
      Hint: Answer
      Value: |
        <div class="ck-content"><p><span>No. LLM usage is included on every plan at no extra token cost. You’re billed for call minutes, plus $9.99 per user / month when you invite an additional user (owner free). Custom VoIP and CRM integrations are also included rather than charged as setup add ons.&nbsp;</span></p></div>
