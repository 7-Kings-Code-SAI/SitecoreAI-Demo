    - ID: "cab9ac37-5565-41a7-ad7c-6b5a21b917c0"
      Hint: Question
      Value: "Gibt es versteckte Gebühren für KI- oder LLM-Nutzung?"
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"
      Hint: __Updated
      Value: 20261006T103736Z
    - ID: "debd65ae-b150-4903-8a34-465eb240d37b"
      Hint: Answer
      Value: |
        <div class="ck-content"><p><span>Nein. Die LLM-Nutzung ist in jedem Tarif ohne zusätzliche Token-Kosten enthalten. Abgerechnet werden Anrufminuten sowie 9,99 $ pro Benutzer/Monat, wenn Sie einen zusätzlichen Benutzer einladen (Inhaber kostenlos). Benutzerdefinierte VoIP- und CRM-Integrationen sind ebenfalls enthalten, anstatt als kostenpflichtige Setup-Add-ons berechnet zu werden.&nbsp;</span></p></div>
