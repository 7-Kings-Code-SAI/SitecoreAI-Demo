      Hint: Question
      Value: "Postoje li skriveni troškovi za AI ili LLM upotrebu?"
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"
      Hint: __Updated
      Value: 20261007T145224Z
    - ID: "debd65ae-b150-4903-8a34-465eb240d37b"
      Hint: Answer
      Value: |
        <div class="ck-content"><p><span>Ne. Upotreba LLM-a uključena je u svaki plan bez dodatnih troškova po tokenu. Naplaćuju se minute poziva, plus 9,99 $ po korisniku mjesečno kada pozovete dodatnog korisnika (vlasnik besplatno). Prilagođene VoIP i CRM integracije također su uključene, umjesto da se dodatno naplaćuju kao dodaci za postavljanje.&nbsp;</span></p></div>
