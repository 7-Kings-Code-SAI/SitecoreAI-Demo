      Hint: Question
      Value: "Finns det dolda avgifter för AI- eller LLM-användning?"
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"
      Hint: __Updated
      Value: 20261006T105532Z
    - ID: "debd65ae-b150-4903-8a34-465eb240d37b"
      Hint: Answer
      Value: |
        <div class="ck-content"><p><span>Nej. LLM-användning ingår i varje plan utan extra kostnad per token. Du debiteras för samtalsminuter, plus 9,99 $ per användare och månad när du bjuder in ytterligare en användare (ägaren är gratis). Anpassade VoIP- och CRM-integrationer ingår också i stället för att debiteras som tillägg för installation.&nbsp;</span></p></div>
