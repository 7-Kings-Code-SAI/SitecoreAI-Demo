    - ID: "cab9ac37-5565-41a7-ad7c-6b5a21b917c0"
      Hint: Question
      Value: "Koliko dugo traje postavljanje i pokretanje AI prodajnog agenta?"
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"
      Hint: __Updated
      Value: 20261007T145224Z
    - ID: "debd65ae-b150-4903-8a34-465eb240d37b"
      Hint: Answer
      Value: |
        <div class="ck-content"><p><span>Većina timova kreće uživo za manje od 12 minuta uz pakete Silver, Gold ili Platinum. Izradite svog agenta (glas, naglasak, osobnost i priručnik), izradite kampanju (odlazna prodaja, kvalifikacija, zadržavanje itd.), uvezite svoje leadove (CRM sinkronizacija, prijenos CSV datoteke ili ručni unos) i pokrenite. Bez koda i bez dugotrajnog uvođenja. Enterprise korisnici dobivaju postavljanje isti dan, a prilagođene integracije dostupne su na zahtjev za timove kojima je potreban CRM, telekomunikacijski pružatelj ili radni tijek koji nije obuhvaćen standardnom ponudom.&nbsp;</span></p></div>
