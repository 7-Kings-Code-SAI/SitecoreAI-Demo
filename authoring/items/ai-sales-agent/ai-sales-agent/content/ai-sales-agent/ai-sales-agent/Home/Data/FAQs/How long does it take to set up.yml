    - ID: "cab9ac37-5565-41a7-ad7c-6b5a21b917c0"
      Hint: Question
      Value: "Wie lange dauert es, einen AI-Vertriebsagenten einzurichten und zu starten?"
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"
      Hint: __Updated
      Value: 20261006T103736Z
    - ID: "debd65ae-b150-4903-8a34-465eb240d37b"
      Hint: Answer
      Value: |
        <div class="ck-content"><p><span>Die meisten Teams sind mit Silver-, Gold- oder Platinum-Tarifen in weniger als 12 Minuten live. Erstellen Sie Ihren Agenten (Stimme, Akzent, Persönlichkeit und Playbook), erstellen Sie eine Kampagne (Outbound, Qualifizierung, Kundenbindung usw.), importieren Sie Ihre Leads (CRM-Synchronisierung, CSV-Upload oder manuelle Eingabe) und starten Sie. Kein Code, kein langwieriges Onboarding. Enterprise-Kunden erhalten die Einrichtung noch am selben Tag; kundenspezifische Integrationen sind auf Anfrage für Teams verfügbar, die ein CRM, einen Telefondienstanbieter oder einen Workflow benötigen, der nicht standardmäßig abgedeckt ist.&nbsp;</span></p></div>
