    - ID: "cab9ac37-5565-41a7-ad7c-6b5a21b917c0"
      Hint: Question
      Value: "Hur lång tid tar det att konfigurera och lansera en AI-säljagent?"
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"
      Hint: __Updated
      Value: 20261006T105532Z
    - ID: "debd65ae-b150-4903-8a34-465eb240d37b"
      Hint: Answer
      Value: |
        <div class="ck-content"><p><span>De flesta team är live på under 12 minuter med planerna Silver, Gold eller Platinum. Bygg din agent (röst, accent, personlighet och spelbok), skapa en kampanj (utgående, kvalificering, retention etc.), importera dina leads (CRM-synkronisering, CSV-uppladdning eller manuell inmatning) och lansera. Ingen kod, ingen lång onboarding. Företagskunder får konfiguration samma dag, med anpassade integrationer tillgängliga på begäran för team som behöver ett CRM, en telefonileverantör eller ett arbetsflöde som inte täcks direkt från start.&nbsp;</span></p></div>
