      Value: "How long does it take to set up and launch an AI sales agent?"
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"
      Hint: __Updated
      Value: 20260921T162916Z
    - ID: "debd65ae-b150-4903-8a34-465eb240d37b"
      Hint: Answer
      Value: |
        <div class="ck-content"><p><span>Most teams live in under 12 minutes on Silver, Gold, or Platinum plans. Build your agent (voice, accent, personality, and playbook), create a campaign (outbound, qualification, retention, etc.), import your leads (CRM sync, CSV upload, or manual entry), and launch. No code, no lengthy onboarding. Enterprise customers get same day setup, with custom integrations available on request for teams that need a CRM, telephony provider, or workflow not covered out of the box.&nbsp;</span></p></div>
