      Hint: Question
      Value: "Hur mycket kostar en AI-säljagent?"
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"
      Hint: __Updated
      Value: 20261006T105532Z
    - ID: "debd65ae-b150-4903-8a34-465eb240d37b"
      Hint: Answer
      Value: |
        <div class="ck-content"><p><span>AI Sale Agent använder enkel prissättning per minut utan avgifter för token eller LLM-användning. Planerna börjar på 15 ¢/min (Silver), 17 ¢/min (Gold) och 19 ¢/min (Platinum), plus 9,99 $ per användare/månad för varje ytterligare användare (arbetsytans ägare ingår utan extra kostnad). Månadsfakturering sparar upp till 31 % jämfört med att betala allt eftersom. Anpassad VoIP- och CRM-integration ingår i varje plan.&nbsp;</span></p></div>
