    - ID: "cab9ac37-5565-41a7-ad7c-6b5a21b917c0"
      Hint: Question
      Value: "Wie viel kostet ein KI-Vertriebsagent?"
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"
      Hint: __Updated
      Value: 20261006T103736Z
    - ID: "debd65ae-b150-4903-8a34-465eb240d37b"
      Hint: Answer
      Value: |
        <div class="ck-content"><p><span>AI Sale Agent verwendet eine einfache minutengenaue Preisgestaltung ohne Token- oder LLM-Nutzungsgebühren. Die Tarife beginnen bei 15 ¢/Min. (Silver), 17 ¢/Min. (Gold) und 19 ¢/Min. (Platinum) sowie 9,99 $ pro Nutzer/Monat für jeden zusätzlichen Nutzer (Workspace-Inhaber inbegriffen kostenlos). Bei monatlicher Abrechnung sparen Sie bis zu 31 % im Vergleich zu Pay-as-you-go. Benutzerdefinierte VoIP- und CRM-Integrationen sind in jedem Tarif enthalten.&nbsp;</span></p></div>
