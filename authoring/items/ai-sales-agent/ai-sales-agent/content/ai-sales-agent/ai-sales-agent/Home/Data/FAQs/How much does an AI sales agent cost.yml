        <div class="ck-content"><p><span>AI Sale Agent uses simple per minute pricing with no token or LLM usage fees. Plans start at 15¢/min (Silver), 17¢/min (Gold), and 19¢/min (Platinum), plus $9.99 per user / month for each additional user (workspace owner included free). Monthly billing saves up to 31% versus pay as you go. Custom VoIP and CRM integration are included on every plan.&nbsp;</span></p></div>
