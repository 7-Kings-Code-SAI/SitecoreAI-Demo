      Hint: Answer
      Value: |
        <div class="ck-content"><p><span>AI Sale Agent koristi jednostavno određivanje cijena po minuti bez naknada za tokene ili korištenje LLM-a. Paketi počinju od 15 ¢/min (Silver), 17 ¢/min (Gold) i 19 ¢/min (Platinum), uz dodatnih 9,99 USD po korisniku mjesečno za svakog dodatnog korisnika (vlasnik radnog prostora uključen je besplatno). Mjesečna naplata štedi do 31 % u odnosu na plaćanje prema potrošnji. Prilagođene VoIP i CRM integracije uključene su u svaki paket.&nbsp;</span></p></div>
