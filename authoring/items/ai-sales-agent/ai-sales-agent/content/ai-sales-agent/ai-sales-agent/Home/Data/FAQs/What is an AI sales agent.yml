    - ID: "cab9ac37-5565-41a7-ad7c-6b5a21b917c0"
      Hint: Question
      Value: "Vad är en AI-säljagent och hur fungerar den?"
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"
      Hint: __Updated
      Value: 20261006T105532Z
    - ID: "debd65ae-b150-4903-8a34-465eb240d37b"
      Hint: Answer
      Value: |
        <div class="ck-content"><p><span>En AI-säljagent är ett röstbaserat AI-system som ringer och tar emot säljsamtal för din räkning. Det hanterar uppsökande kontakt, uppföljningar och kvalificering av leads på samma sätt som en mänsklig säljare skulle göra. AI Sale Agent bygger en anpassad agent för ditt företag, komplett med egen röst, accent och personlighet, och kopplar den sedan till din leadlista och ditt CRM. Agenten ringer prospekt, för naturliga samtal, hanterar invändningar, kvalificerar leadet utifrån dina kriterier och loggar automatiskt ett transkript, en sammanfattning och en CRM-uppdatering när samtalet avslutas.&nbsp;</span></p></div>
