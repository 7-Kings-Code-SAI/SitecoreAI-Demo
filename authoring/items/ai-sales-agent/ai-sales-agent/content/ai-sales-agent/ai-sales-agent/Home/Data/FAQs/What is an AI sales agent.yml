    - ID: "cab9ac37-5565-41a7-ad7c-6b5a21b917c0"
      Hint: Question
      Value: "Što je AI prodajni agent i kako funkcionira?"
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"
      Hint: __Updated
      Value: 20261007T145224Z
    - ID: "debd65ae-b150-4903-8a34-465eb240d37b"
      Hint: Answer
      Value: |
        <div class="ck-content"><p><span>AI prodajni agent je glasovni AI sustav koji u vaše ime obavlja i prima prodajne pozive. Obavlja kontaktiranje, naknadne pozive i kvalifikaciju leadova na isti način kao ljudski prodajni predstavnik. AI Sale Agent izrađuje prilagođenog agenta za vaše poslovanje, s vlastitim glasom, naglaskom i osobnošću, a zatim ga povezuje s vašim popisom leadova i CRM-om. Agent zove potencijalne klijente, vodi prirodan razgovor, rješava prigovore, kvalificira lead prema vašim kriterijima te automatski bilježi transkript, sažetak i ažuriranje u CRM-u nakon završetka poziva.&nbsp;</span></p></div>
