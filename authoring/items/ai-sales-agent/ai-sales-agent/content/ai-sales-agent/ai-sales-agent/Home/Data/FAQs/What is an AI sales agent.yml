    - ID: "cab9ac37-5565-41a7-ad7c-6b5a21b917c0"
      Hint: Question
      Value: "Was ist ein KI-Vertriebsagent und wie funktioniert er?"
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"
      Hint: __Updated
      Value: 20261006T103736Z
    - ID: "debd65ae-b150-4903-8a34-465eb240d37b"
      Hint: Answer
      Value: |
        <div class="ck-content"><p><span>Ein KI-Vertriebsagent ist ein sprachbasierter KI-System, das in Ihrem Auftrag Verkaufsgespräche führt und entgegennimmt. Es übernimmt die Kontaktaufnahme, Nachfassaktionen und Lead-Qualifizierung genauso wie ein menschlicher Vertriebsmitarbeiter. AI Sale Agent erstellt einen individuellen Agenten für Ihr Unternehmen, komplett mit eigener Stimme, eigenem Akzent und eigener Persönlichkeit, und verbindet ihn dann mit Ihrer Lead-Liste und Ihrem CRM. Der Agent ruft Interessenten an, führt ein natürliches Gespräch, behandelt Einwände, qualifiziert den Lead anhand Ihrer Kriterien und protokolliert nach Gesprächsende automatisch ein Transkript, eine Zusammenfassung und ein CRM-Update.&nbsp;</span></p></div>
