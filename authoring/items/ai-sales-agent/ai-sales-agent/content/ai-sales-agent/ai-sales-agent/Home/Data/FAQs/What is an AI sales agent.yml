    - ID: "cab9ac37-5565-41a7-ad7c-6b5a21b917c0"
      Hint: Question
      Value: "What is an AI sales agent and how does it work?"
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"
      Hint: __Updated
      Value: 20260921T161152Z
    - ID: "debd65ae-b150-4903-8a34-465eb240d37b"
      Hint: Answer
      Value: |
        <div class="ck-content"><p><span>An AI sales agent is a voice based AI system that makes and takes sales calls on your behalf. It handles outreach, follow ups, and lead qualification the same way a human rep would. AI Sale Agent builds a custom agent for your business, complete with its own voice, accent, and personality, then connects it to your lead list and CRM. The agent calls prospects, holds a natural conversation, handles objections, qualifies the lead against your criteria, and logs a transcript, summary, and CRM update automatically once the call ends.&nbsp;</span></p></div>
