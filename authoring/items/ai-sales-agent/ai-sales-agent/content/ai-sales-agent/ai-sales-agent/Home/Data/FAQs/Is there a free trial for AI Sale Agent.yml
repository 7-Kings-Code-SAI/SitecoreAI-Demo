    - ID: "cab9ac37-5565-41a7-ad7c-6b5a21b917c0"
      Hint: Question
      Value: "Gibt es eine kostenlose Testversion für AI Sale Agent?"
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"
      Hint: __Updated
      Value: 20261006T103736Z
    - ID: "debd65ae-b150-4903-8a34-465eb240d37b"
      Hint: Answer
      Value: |
        <div class="ck-content"><p><span>Ja. AI Sale Agent bietet eine 7-tägige kostenlose Testversion mit 3 Stunden Anrufminuten, 3 benutzerdefinierten Agenten, 3 Vertriebskampagnen, bis zu 100 Leads sowie 1 aktiven CRM-Integration und 1 aktiven VoIP-Integration. Das reicht aus, um einen echten Agenten zu erstellen, eine reale Kampagne durchzuführen und zu sehen, wie qualifizierte Leads in Ihrem CRM landen, bevor Sie sich für einen kostenpflichtigen Tarif entscheiden.&nbsp;</span></p></div>
