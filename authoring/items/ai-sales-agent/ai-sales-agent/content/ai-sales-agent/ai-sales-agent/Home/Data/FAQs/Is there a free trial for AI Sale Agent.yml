        <div class="ck-content"><p><span>Yes. AI Sale Agent offers a 7 day free trial that includes 3 hours of calling minutes, 3 custom agents, 3 sales campaigns, up to 100 leads, and 1 active CRM integration plus 1 active VoIP integration. It’s enough to build a real agent, run an actual campaign, and see qualified leads land in your CRM before you commit to a paid plan.&nbsp;</span></p></div>
