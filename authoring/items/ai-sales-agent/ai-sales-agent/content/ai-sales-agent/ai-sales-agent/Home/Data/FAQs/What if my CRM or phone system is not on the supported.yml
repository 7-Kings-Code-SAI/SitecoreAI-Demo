      Hint: Question
      Value: "Što ako moj CRM ili telefonski sustav nije na popisu podržanih?"
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"
      Hint: __Updated
      Value: 20261007T145227Z
    - ID: "debd65ae-b150-4903-8a34-465eb240d37b"
      Hint: Answer
      Value: |
        <div class="ck-content"><p><span>AI Sale Agent izradit će prilagođenu integraciju za CRM-ove koji još nisu podržani, a prilagođene integracije operatera ili SIP integracije dostupne su na zahtjev za telefoniju. Vrijedi to izravno provjeriti s timom putem demonstracije ili upita za kontakt, budući da dostupnost ovisi o vašem specifičnom tehnološkom okruženju.&nbsp;</span></p></div>
