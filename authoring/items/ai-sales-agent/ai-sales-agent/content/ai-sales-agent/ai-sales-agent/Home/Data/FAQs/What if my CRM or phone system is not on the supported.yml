    - ID: "cab9ac37-5565-41a7-ad7c-6b5a21b917c0"
      Hint: Question
      Value: "Was ist, wenn mein CRM- oder Telefonsystem nicht auf der Liste der unterstützten Systeme steht?"
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"
      Hint: __Updated
      Value: 20261006T103739Z
    - ID: "debd65ae-b150-4903-8a34-465eb240d37b"
      Hint: Answer
      Value: |
        <div class="ck-content"><p><span>AI Sale Agent erstellt eine benutzerdefinierte Integration für CRMs, die noch nicht unterstützt werden, und benutzerdefinierte Carrier- oder SIP-Integrationen für die Telefonie sind auf Anfrage verfügbar. Es lohnt sich, dies direkt mit dem Team über eine Demo- oder Kontaktanfrage zu besprechen, da die Verfügbarkeit von Ihrem spezifischen Stack abhängt.&nbsp;</span></p></div>
