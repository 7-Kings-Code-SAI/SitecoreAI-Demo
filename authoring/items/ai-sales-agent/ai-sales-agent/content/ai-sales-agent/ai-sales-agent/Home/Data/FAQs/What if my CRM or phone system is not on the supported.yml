        <div class="ck-content"><p><span>AI Sale Agent will build a custom integration for CRMs that aren’t already supported, and custom carrier or SIP integrations are available on request for telephony. It’s worth raising directly with the team via a demo or contact request, since availability depends on your specific stack.&nbsp;</span></p></div>
