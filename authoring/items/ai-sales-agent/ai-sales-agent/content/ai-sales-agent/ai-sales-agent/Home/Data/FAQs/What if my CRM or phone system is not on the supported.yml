      Hint: Question
      Value: "Vad händer om mitt CRM- eller telefonsystem inte finns med på listan över stödda system?"
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"
      Hint: __Updated
      Value: 20261006T105536Z
    - ID: "debd65ae-b150-4903-8a34-465eb240d37b"
      Hint: Answer
      Value: |
        <div class="ck-content"><p><span>AI Sale Agent bygger en anpassad integration för CRM-system som ännu inte stöds, och anpassade operatörs- eller SIP-integrationer för telefoni erbjuds på begäran. Det är värt att ta upp detta direkt med teamet via en demo- eller kontaktförfrågan, eftersom tillgängligheten beror på er specifika tekniska miljö.&nbsp;</span></p></div>
